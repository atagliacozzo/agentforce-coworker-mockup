<title>Mockup Agentforce Coworker</title>
<style>
:root{
  --page:#e9eef4;--card:#ffffff;--sunk:#f3f6f9;--ink:#14202e;--muted:#5c6b7c;--line:#dce3eb;
  --accent:#0b5cab;--accent-soft:#e3eefa;--on-accent:#ffffff;--danger:#b3261e;--warn:#a3256a;--ok:#1e7a4c;
  --voice:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{--page:#0e141b;--card:#17202a;--sunk:#1e2935;--ink:#e8eef5;--muted:#93a3b5;--line:#2b3846;
    --accent:#5aa2ea;--accent-soft:#1b3350;--on-accent:#0e141b;--danger:#f2958f;--warn:#f08fc0;--ok:#7cd1a0}
}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#000;color:var(--ink);min-height:100vh}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}
.i.flip{transform:rotate(180deg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.bar h1{font-size:16px;font-weight:600;margin:0 auto 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ico{padding:4px 6px}
#status{font-size:13px;color:#a9b7c6;padding:6px 20px;min-height:30px}
.wrap{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:28px;max-width:1080px;margin:8px auto 40px;padding:0 20px;align-items:start}
.pres .cfg,.pres .bar,.pres #status{display:none}
.pres .wrap{grid-template-columns:1fr;justify-items:center;margin:0;padding:0 20px;width:100%}
html.pres{overflow:hidden;height:100%}
body.pres{overflow:hidden;height:100vh;min-height:0;display:flex;align-items:center;justify-content:center}
body.pres .phone{position:relative;top:auto;height:min(740px,calc(100vh - 32px))}
.hot{position:fixed;top:0;right:0;width:72px;height:72px;border:none;background:transparent;padding:0;z-index:20;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(max-width:860px){.wrap{grid-template-columns:1fr;justify-items:center}}
.phone{position:sticky;top:16px;width:100%;max-width:380px;height:740px;background:var(--card);border:1px solid var(--line);border-radius:36px;padding:14px 16px 16px;display:flex;flex-direction:column;box-shadow:0 0 0 10px #1b1b1d,0 0 0 11px #4a4a4e,0 0 70px 12px rgba(90,162,234,.14);overflow:hidden}
@media(max-width:860px){.phone{position:relative}}
@media(max-width:520px){.phone{height:calc(100vh - 120px);min-height:560px;border-radius:24px;box-shadow:none}}
.sb{display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:0 8px 6px}
.sb span:last-child{display:flex;gap:6px}
.hd{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line);min-height:40px}
.hd>span{display:flex;align-items:center;gap:4px;min-width:60px}
.hd b{font-weight:600;color:var(--ink);flex:1;text-align:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd button{border:none;background:none;padding:4px;color:var(--muted);display:flex;align-items:center;gap:4px;font-size:13px;border-radius:8px}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.mark{width:80px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.greet{font-family:var(--voice);font-style:italic;font-size:24px;line-height:1.3;margin:0 0 20px}
.field{display:flex;gap:8px;align-items:flex-end;width:100%;border:1px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px;background:var(--card);text-align:left}
.field:focus-within{border-color:var(--accent)}
.field textarea{border:none;background:none;flex:1;min-width:0;resize:none;outline:none;font:inherit;color:inherit;line-height:1.45;padding:6px 0;height:34px;max-height:112px;overflow-y:auto}
.send{border:none;border-radius:50%;width:34px;height:34px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.err{font-size:12px;color:var(--danger);min-height:18px;width:100%;text-align:left;padding:2px 6px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:14px;background:var(--card);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.menu{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:10px;overflow:hidden;text-align:left}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:11px 14px;font-size:14px;line-height:1.4}
.menu button+button{border-top:1px solid var(--line)}
.menu button:hover{background:var(--sunk)}
.chat:focus{outline:none}
.chat{flex:1;overflow-y:auto;padding:4px 2px 8px;display:flex;flex-direction:column}
.bub{align-self:flex-end;background:var(--sunk);border-radius:16px 16px 4px 16px;padding:9px 13px;font-size:14px;max-width:86%;margin:12px 0 4px}
.cp{align-self:flex-end;color:var(--muted);margin:0 6px 8px}
.as{font-size:14px;line-height:1.55;margin:6px 0}
.as p{margin:0 0 8px}
.as ul,.as ol{margin:0 0 8px;padding-left:22px}
.as li{margin-bottom:6px}
.as p:last-child,.as ul:last-child,.as ol:last-child{margin-bottom:0}
.dots{display:flex;gap:5px;padding:10px 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pu 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pu{0%,100%{opacity:.25}50%{opacity:1}}
.tool{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;color:var(--muted);padding:8px 10px;margin:6px 0;background:var(--sunk);border-radius:10px}
.tool .tl{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
.tool .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tool .td{grid-column:1 / -1;padding-left:21px;word-break:break-word}
.tool.retry .tl{color:var(--warn)}
.tool.error .tl,.tool.error .tr{color:var(--danger)}
.tool .tr .ok{color:var(--ok)}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.dots i{animation:none}}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 8px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.cit{display:inline-block;min-width:17px;text-align:center;font-size:11px;line-height:17px;border-radius:9px;background:var(--accent-soft);color:var(--accent);text-decoration:none;padding:0 4px;margin:0 1px;vertical-align:text-top}
.fig{margin:6px 0 10px}
.fig button{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:0;background:var(--sunk);overflow:hidden}
.fig img{display:block;width:100%;height:auto}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.imgmiss{border:1px dashed var(--border,var(--line));border-radius:12px;padding:12px;font-size:12px;line-height:1.4;color:var(--muted);margin:6px 0 10px;background:var(--sunk);word-break:break-word}
.zoom{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.84);border:none;padding:16px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:0}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.fb{display:flex;gap:4px;margin:2px 0 6px;color:var(--muted)}
.fb button{border:none;background:none;padding:5px;border-radius:8px;color:inherit;display:flex}
.fb button:hover{background:var(--sunk)}
.fb button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.src{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;margin:4px 0 8px;color:var(--muted)}
.src div+div{margin-top:6px}
.src b{color:var(--ink);font-weight:600}
.fu{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.fu button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:16px;padding:5px 12px;font-size:13px;text-align:left}
.fu button:hover{background:var(--accent-soft)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.38);border:none;width:100%;height:100%;z-index:5;padding:0;border-radius:0}
.drawer{position:absolute;top:0;bottom:0;left:0;width:80%;background:var(--card);z-index:6;padding:22px 12px 14px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.dh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:0 10px 10px}
.dh .mk{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.dh .mk img{width:100%;height:100%;object-fit:contain;display:block}
.di{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.di:hover{background:var(--sunk)}
.di.sel{background:var(--accent-soft);color:var(--accent)}
.dl{font-size:12px;color:var(--muted);margin:16px 10px 4px}
.rec{font-size:13px;line-height:1.35;padding:8px 10px}
.who{margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:13px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.toast{position:absolute;left:20px;right:20px;bottom:88px;background:var(--ink);color:var(--card);border-radius:10px;padding:8px 12px;font-size:13px;text-align:center;z-index:7}
.cfg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.cfg h2{font-size:16px;margin:0 0 2px}
.cfg h3{font-size:14px;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.cfg p.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.cfg label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.cfg input,.cfg select,.cfg textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;font-size:14px}
.cfg textarea{min-height:70px;resize:vertical}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.cols2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pr{display:block;width:100%;text-align:left;font-size:13px;padding:8px 10px;margin-top:6px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.pr.sel,.tab.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.step{border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin-top:12px;background:var(--sunk)}
.step .sh{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.step .sh span{display:flex;gap:4px}
.step input,.step select,.step textarea{background:var(--card)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cfginfo{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--sunk);border-radius:10px;padding:10px 14px;margin:14px 0 6px}
.cfginfo .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cfginfo .v{font-weight:600;font-size:14px;word-break:break-all;margin:2px 0}
.cfginfo .v code{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:none;padding:0}
.cfginfo .m{font-size:12px;color:var(--muted);line-height:1.45}
</style>
</head>

  R.view="chat";R.err="";R.drawer=false;R.skipFn=null;R.run++;var id=R.run;R.busy=true;R.paused=false;R.cont=null;R.ran.push(p.q);
  R.msgs.push({role:"u",text:p.q});

function waitDots(p,id){
  var w=(+p.dotsSec>=0?+p.dotsSec:0.8)*1000,fin=false,tm=null;
  function go(){
    if(fin)return;fin=true;clearTimeout(tm);
    if(R.skipFn===go)R.skipFn=null;
    if(id!==R.run)return;
    afterDots(p,id);
  }
  if(w<=0)return go();
  R.skipFn=go;tm=setTimeout(go,w);
}
function agentMsg(text){
  var lines=String(text).split("\n").filter(function(l){return l.trim()});
  if(!lines.length)lines=[""];
  return{role:"a",text:String(text),lines:lines,n:1};
}
function lineRange(){
  var mn=parseFloat(C.lineMin),mx=parseFloat(C.lineMax);
  if(!(mn>=0))mn=1;
  if(!(mx>=mn))mx=Math.max(mn,mx>=0?mx:3);
  return[mn,mx];
}
function revealLines(m,id,done){
  if(m.n>=m.lines.length){done();return}
  var r=lineRange(),fin=false,tm=null;
  function delay(){return(r[0]+Math.random()*(r[1]-r[0]))*1000}
  function showAll(){
    if(fin)return;fin=true;clearTimeout(tm);
    if(R.skipFn===showAll)R.skipFn=null;
    if(id!==R.run)return;
    m.n=m.lines.length;renderPhone();done();
  }
  function step(){
    if(fin||id!==R.run)return;
    m.n++;renderPhone();
    if(m.n>=m.lines.length){fin=true;if(R.skipFn===showAll)R.skipFn=null;done();return}
    tm=setTimeout(step,delay());
  }
  R.skipFn=showAll;
  tm=setTimeout(step,delay());
}
function afterDots(p,id){
  if(id!==R.run)return;
  for(var k=R.msgs.length-1;k>=0;k--){if(R.msgs[k].role==="d"){R.msgs.splice(k,1);break}}
  var ack=(p.ack||"").trim();
  if(!ack)return runSteps(p,0,id);
  var am=agentMsg(ack);R.msgs.push(am);renderPhone();
  revealLines(am,id,function(){
    if(id!==R.run)return;
    checkpoint({phase:"ack",p:p});
    waitAck(p,id);
  });
}
function waitAck(p,id){
  var w=(+p.ackSec>=0?+p.ackSec:1.5)*1000,fin=false,tm=null;
  function go(){
    if(fin)return;fin=true;clearTimeout(tm);
    if(R.skipFn===go)R.skipFn=null;
    if(id!==R.run)return;
    runSteps(p,0,id);
  }
  R.skipFn=go;tm=setTimeout(go,w);
}
function runSteps(p,i,id){
  if(id!==R.run)return;
  var steps=p.steps||[];
  if(i>=steps.length)return finishAnswer(p,id);
  var s=steps[i];
  var sw=(+s.sayWait>0?+s.sayWait:0)*1000;
  if(!s.say)return runStep(p,i,id);
  var sm=agentMsg(s.say);R.msgs.push(sm);renderPhone();
  revealLines(sm,id,function(){
    if(id!==R.run)return;
    if(sw<=0)return runStep(p,i,id);
    var f3=false,tm3=null;
    var go3=function(){
      if(f3)return;f3=true;clearTimeout(tm3);
      if(R.skipFn===go3)R.skipFn=null;
      if(id!==R.run)return;
      runStep(p,i,id);
    };
    R.skipFn=go3;tm3=setTimeout(go3,sw);
  });
}
function runStep(p,i,id){
  var s=p.steps[i];
  var t={role:"t",kind:s.kind,label:s.label,detail:s.detail,res:s.res,state:s.state,done:false};
  R.msgs.push(t);renderPhone();
  var mn=+s.min>=0?+s.min:1.2,mx=+s.max>=mn?+s.max:mn;
  var wait=Math.max(200,(mn+Math.random()*(mx-mn))*1000);
  var finished=false,tm=null;
  function complete(){
    if(finished)return;
    finished=true;clearTimeout(tm);
    if(R.skipFn===complete)R.skipFn=null;
    if(id!==R.run)return;
    t.done=true;renderPhone();
    checkpoint({phase:"step",p:p,i:i+1});
    setTimeout(function(){runSteps(p,i+1,id)},300);
  }
  R.skipFn=complete;
  tm=setTimeout(complete,wait);
}
function finishAnswer(p,id){
  if(id!==R.run)return;
  var m={role:"f",raw:p.intro||"",n:0,done:false,p:p,follow:lines(p.follow),srcView:null,fb:null};
  R.msgs.push(m);renderPhone();
  var idx=R.msgs.length-1;
  typer=setInterval(function(){
    if(id!==R.run){clearInterval(typer);return}
    m.n+=6;
    if(m.n>=m.raw.length){
      m.n=m.raw.length;m.done=true;R.busy=false;clearInterval(typer);renderPhone();
      checkpoint({phase:"done",p:p});
      return;
    }
    var el=document.querySelector('[data-mi="'+idx+'"]');
    if(el){el.innerHTML=finalInner(m,idx);var ch=$("chat");if(ch)ch.scrollTop=ch.scrollHeight}
  },26);
}
function resolvePrompt(txt){
  var f=null,x=String(txt).trim().toLowerCase();
  C.cats.forEach(function(c){c.prompts.forEach(function(p){if(p.q.trim().toLowerCase()===x)f=p})});
  return f||{q:txt,steps:[],type:"text",intro:C.fallback,cols:"",rows:"",outro:"",follow:"",sources:"",images:"",ack:"",ackSec:0,dotsSec:0.8};
}
function freeText(txt){runPrompt(resolvePrompt(txt))}
function sendAwaited(){
  if(R.await){var a=R.await;R.await=null;R.typing=false;a.fn();return true}
  if(R.paused&&R.cont&&R.cont.phase==="send"){resumeFlow();return true}
  return false;
}
function submitAsk(){

}
var KB=["qwertyuiop","asdfghjkl","zxcvbnm"];
function neighbor(ch){
  var lo=ch.toLowerCase(),r=-1,c=-1;
  for(var a=0;a<KB.length;a++){var k=KB[a].indexOf(lo);if(k>=0){r=a;c=k}}
  if(r<0)return "";
  var out=[];
  for(var y=r-1;y<=r+1;y++){
    if(y<0||y>=KB.length)continue;
    for(var x=c-1;x<=c+1;x++){
      if(x<0||x>=KB[y].length||(y===r&&x===c))continue;
      out.push(KB[y].charAt(x));
    }
  }
  if(!out.length)return "";
  var w=out[Math.floor(Math.random()*out.length)];
  return ch===lo?w:w.toUpperCase();
}
function planTypos(text){
  var L=text.length,n=L<25?0:L<70?1:L<130?2:3,plan={},tries=0,used=[];
  while(n>0&&tries<80){
    tries++;
    var p=6+Math.floor(Math.random()*Math.max(1,L-12));
    if(p>=L-4)continue;
    var ch=text.charAt(p);
    if(!/[a-zA-Z]/.test(ch)||!neighbor(ch))continue;
    var ok=true;used.forEach(function(u){if(Math.abs(u-p)<16)ok=false});
    if(!ok)continue;
    plan[p]=true;used.push(p);n--;
  }
  return plan;
}
function typeThen(text,fn,contP){
  var sp=+C.typeSpeed;
  if(R.typing)return;
  if(!(sp>0)||!text){fn();return}
  clearTimeout(typeT);
  R.typing=true;R.err="";R.drawer=false;
  renderPhone();
  var inp=$("ask");
  if(!inp){R.typing=false;fn();return}
  inp.value="";inp.readOnly=true;autosize(inp);
  try{inp.focus({preventScroll:true})}catch(e){}
  var human=C.typeHuman!==false,plan=human?planTypos(text):{};
  var base=1000/sp,fin=false,pos=0,cur="",mode="ok",errLen=0,extra=0,hesAt=-1;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function show(v){var el=$("ask");if(!el)return false;cur=v;el.value=v;autosize(el);return true}
  function next(ms){typeT=setTimeout(tick,ms)}
  function finish(){
    if(fin)return;fin=true;clearTimeout(typeT);
    if(R.skipFn===finish)R.skipFn=null;
    show(text);
    if(contP)checkpoint({phase:"send",p:contP,draft:text});
    R.await={fn:fn};
  }
  function tick(){
    if(fin||!R.typing||!$("ask"))return;
    if(mode==="err"){
      if(extra>0&&pos+errLen<text.length){show(cur+text.charAt(pos+errLen));errLen++;extra--;return next(base*rnd(.5,1.1))}
      mode="notice";return next(rnd(420,850));
    }
    if(mode==="notice"){mode="back";return next(0)}
    if(mode==="back"){
      if(errLen>0){show(cur.slice(0,-1));errLen--;return next(rnd(60,100))}
      mode="ok";return next(rnd(180,340));
    }
    if(pos>=text.length)return finish();
    var ch=text.charAt(pos);
    if(human){
      var prev=pos>0?text.charAt(pos-1):"";
      var boundary=prev===" "||prev===":"||prev===","||prev===".";
      if(hesAt!==pos&&pos>2&&((boundary&&Math.random()<0.13)||Math.random()<0.012)){hesAt=pos;return next(rnd(450,1150))}
      if(plan[pos]){
        var w=neighbor(ch);delete plan[pos];
        if(w){show(cur+w);errLen=1;extra=Math.floor(rnd(0,3));mode="err";return next(base*rnd(.6,1.2))}
      }
    }
    pos++;show(text.slice(0,pos));
    if(pos>=text.length)return finish();
    next(base*rnd(.55,1.45));
  }
  R.skipFn=finish;
  typeT=setTimeout(tick,300);
}

  h+='<label>Risposta alle domande non configurate</label><textarea data-g="fallback" style="min-height:56px">'+esc(C.fallback)+'</textarea>';

    return '<button class="btn tab'+(i===R.ci?" sel":"")+'" data-a="cat:'+i+'">'+ic(ICONS[i%4])+esc(x.label||"Senza nome")+"</button>";
  }).join("")+'<button class="btn" data-a="addcat">'+ic("plus")+"Categoria</button></div>";
  if(c){
    h+='<label>Nome della categoria</label><input data-f="catlabel" value="'+esc(c.label)+'">';
    h+="<label>Domande suggerite</label>"+(c.prompts.length?c.prompts.map(function(x,i){
      return '<button class="pr'+(i===R.pi?" sel":"")+'" data-a="pr:'+i+'">'+esc(x.q||"Senza titolo")+(x.hidden?" · nascosta":"")+"</button>";
    }).join(""):'<p class="hint" style="margin-top:6px">Questa categoria è vuota. Aggiungi una domanda per iniziare.</p>');
    h+='<div class="row"><button class="btn sm" data-a="addpr">'+ic("plus","sm")+'Aggiungi domanda</button><button class="btn sm" data-a="delcat">'+ic("trash","sm")+"Elimina categoria</button></div>";
  }else{
    h+='<p class="hint" style="margin-top:10px">Nessuna categoria. Creane una per mostrare i chip nella home.</p>';
  }
  if(p)h+=promptFields(p);
  $("cfg").innerHTML=h;
}
function refreshHome(){if(R.view==="home")renderPhone()}
$("cfg").addEventListener("input",function(e){
  var t=e.target,g=t.getAttribute("data-g"),f=t.getAttribute("data-f"),si=t.getAttribute("data-si");
  if(g){if(g==="typeSpeed"||g==="lineMin"||g==="lineMax"){var ts=parseFloat(t.value);C[g]=(isNaN(ts)||ts<0)?0:ts}else if(g==="typeHuman"){C[g]=t.value==="1"}else{C[g]=t.value}}
  else if(si!==null){
    var p0=cur();if(!p0)return;var s=p0.steps[+si];if(!s)return;
    var sf=t.getAttribute("data-sf");
    if(sf==="min"||sf==="max"||sf==="sayWait"){var v=parseFloat(t.value);s[sf]=(isNaN(v)||v<0)?0:v}
    else s[sf]=t.value;
  }
  else if(f==="catlabel"){C.cats[R.ci].label=t.value;var cb=document.querySelector('[data-a="cat:'+R.ci+'"]');if(cb)cb.innerHTML=ic(ICONS[R.ci%4])+esc(t.value||"Senza nome")}
  else if(f){var p=cur();if(!p)return;p[f]=(t.type==="checkbox")?t.checked:((f==="ackSec"||f==="dotsSec")?(function(){var v=parseFloat(t.value);return(isNaN(v)||v<0)?0:v})():t.value);
    if(f==="type")$("tblf").style.display=t.value==="table"?"block":"none";
    if(f==="q"||f==="hidden"){var pb=document.querySelector('[data-a="pr:'+R.pi+'"]');if(pb)pb.textContent=(p.q||"Senza titolo")+(p.hidden?" · nascosta":"")}}
  save();touch();refreshHome();
});
$("cfg").addEventListener("change",function(e){
  var t=e.target;
  if(!t.hasAttribute("data-si"))return;
  var sf=t.getAttribute("data-sf");
  if(sf==="min"||sf==="max"){
    var p=cur(),s=p&&p.steps[+t.getAttribute("data-si")];
    if(s&&s.max<s.min){
      s.max=s.min;
      var box=t.closest(".step"),other=box&&box.querySelector('[data-sf="max"]');
      if(other)other.value=s.max;
      say("L'attesa massima non può essere minore della minima: l'ho allineata.");
    }
  }
  save();touch();
});
$("cfg").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!b.getAttribute("data-a"))return;
  var a=b.getAttribute("data-a").split(":"),k=a[0],n=+a[1],p=cur();
  if(k==="cat"){R.ci=n;R.pi=0}
  else if(k==="pr"){R.pi=n}
  else if(k==="addcat"){C.cats.push({label:"Nuova categoria",prompts:[]});R.ci=C.cats.length-1;R.pi=0;R.open=R.ci}
  else if(k==="delcat"){C.cats.splice(R.ci,1);R.ci=0;R.pi=0;R.open=C.cats.length?0:null}
  else if(k==="addpr"){C.cats[R.ci].prompts.push({q:"Nuova domanda",steps:[S("sf","Ricerca record Salesforce","","","ok",1200,"")],type:"text",intro:"Scrivi qui la risposta.",cols:"Colonna 1 | Colonna 2",rows:"",outro:"",follow:"",sources:"",images:"",hidden:false,ack:"",ackSec:1.5,dotsSec:0.8});R.pi=C.cats[R.ci].prompts.length-1;R.open=R.ci}
  else if(k==="delpr"){C.cats[R.ci].prompts.splice(R.pi,1);R.pi=0}
  else if(k==="stadd"&&p){p.steps.push(S("slack","Ricerca su Slack","","","ok",1200,""))}
  else if(k==="stdel"&&p){p.steps.splice(n,1)}
  else if(k==="stup"&&p&&n>0){var t1=p.steps[n];p.steps[n]=p.steps[n-1];p.steps[n-1]=t1}
  else if(k==="stdn"&&p&&n<p.steps.length-1){var t2=p.steps[n];p.steps[n]=p.steps[n+1];p.steps[n+1]=t2}
  else if(k==="pickimg"){$("imgfile").click();return}
  else if(k==="test"){if(p){newChat();typeThen(p.q,function(){runPrompt(p)},p)}return}
  save();if(k!=="cat"&&k!=="pr")touch();refreshHome();renderCfg();
});

function togglePres(){R.pres=!R.pres;document.body.classList.toggle("pres",R.pres);document.documentElement.classList.toggle("pres",R.pres)}
var lastTap=0;
$("hot").addEventListener("dblclick",function(e){e.preventDefault();togglePres()});
$("hot").addEventListener("touchend",function(e){
  var now=Date.now();
  if(now-lastTap<350){e.preventDefault();lastTap=0;togglePres()}else{lastTap=now}
});
$("hot").addEventListener("keydown",function(e){if(e.key==="Enter"){togglePres()}});
$("b-hide").addEventListener("click",togglePres);
function toggleFullscreen(){
  var d=document,el=d.documentElement;
  var on=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(on){var ex=d.exitFullscreen||d.webkitExitFullscreen;if(ex)ex.call(d)}
    else{
      var rq=el.requestFullscreen||el.webkitRequestFullscreen;
      if(!rq){toast("Schermo intero non disponibile in questo browser");return}
      var pr=rq.call(el);
      if(pr&&pr.catch)pr.catch(function(){toast("Schermo intero non disponibile in questo browser")});
    }
  }catch(err){toast("Schermo intero non disponibile in questo browser")}
}
function fieldBlocks(e){
  var t=e.target,g=t&&t.tagName;
  var ed=(g==="INPUT"||g==="TEXTAREA"||g==="SELECT"||(t&&t.isContentEditable));
  if(!ed)return false;
  if(t.id==="ask"){
    if(t.readOnly)return false;
    if(t.value===""&&!e.shiftKey&&e.key===e.key.toLowerCase())return false;
  }
  return true;
}
function restartAll(){
  var z=document.querySelector(".zoom");
  if(z&&z.parentNode)z.parentNode.removeChild(z);
  clearTimeout(toastT);R.toast="";
  newChat();
  R.open=C.cats.length?0:null;
  renderPhone();
}
document.addEventListener("keydown",function(e){
  if((e.key==="r"||e.key==="R")&&!e.altKey&&!e.ctrlKey&&!e.metaKey){
    if(!fieldBlocks(e)){e.preventDefault();restartAll();return}
  }
  if((e.key==="f"||e.key==="F")&&!e.altKey&&!e.ctrlKey&&!e.metaKey){
    if(!fieldBlocks(e)){e.preventDefault();toggleFullscreen();return}
  }
  if(e.key==="Enter"&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&(R.await||(R.paused&&R.cont&&R.cont.phase==="send"))){
    var tgE=e.target;
    var tnE=tgE&&tgE.tagName;
    var blockE=(tnE==="INPUT"||tnE==="TEXTAREA"||tnE==="SELECT"||tnE==="BUTTON")&&!(tgE.id==="ask");
    if(!blockE){e.preventDefault();sendAwaited();return}
  }
  if(e.key==="ArrowLeft"&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    var tgL=e.target,tagL=tgL&&tgL.tagName;
    var edL=(tagL==="INPUT"||tagL==="TEXTAREA"||tagL==="SELECT");
    if(edL&&!(tgL.id==="ask"&&(tgL.value===""||tgL.readOnly)))return;
    if(document.querySelector(".zoom"))return;
    e.preventDefault();stepBack();return;
  }
  if(e.key==="ArrowDown"&&!R.skipFn&&R.paused&&!R.typing){
    var tgD=e.target,tagD=tgD&&tgD.tagName;
    if(tgD&&tgD.id!=="ask"&&(tagD==="TEXTAREA"||tagD==="SELECT"||tagD==="INPUT"))return;
    e.preventDefault();resumeFlow();return;
  }
  if(e.key==="ArrowDown"&&R.skipFn){
    var tg=e.target,tag=tg&&tg.tagName;
    if(tg&&tg.id!=="ask"&&(tag==="TEXTAREA"||tag==="SELECT"||tag==="INPUT"))return;
    e.preventDefault();R.skipFn();return;
  }
  if((e.key==="ArrowUp"||e.key==="ArrowDown"||e.key==="PageUp"||e.key==="PageDown")&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    var chS=$("chat");
    if(chS){
      var tS=e.target,gS=tS&&tS.tagName;
      var edS=(gS==="INPUT"||gS==="TEXTAREA"||gS==="SELECT");
      var okS=!edS||(tS.id==="ask"&&tS.value==="");
      var inS=R.pres||$("phone").contains(tS);
      if(okS&&inS){
        var dy=(e.key==="PageUp"||e.key==="PageDown")?Math.round(chS.clientHeight*0.9):70;
        if(e.key==="ArrowUp"||e.key==="PageUp")dy=-dy;
        chS.scrollBy({top:dy});
        e.preventDefault();return;
      }
    }
  }
  if(e.key==="ArrowRight"&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    var tg2=e.target,tag2=tg2&&tg2.tagName;
    var editable=(tag2==="INPUT"||tag2==="TEXTAREA"||tag2==="SELECT");
    if(editable&&!(tg2.id==="ask"&&tg2.value===""))return;
    if(document.querySelector(".zoom"))return;
    e.preventDefault();triggerHidden();return;
  }
  if(e.key!=="Escape")return;
  var z=document.querySelector(".zoom");
  if(z){z.parentNode.removeChild(z);return}
  if(!R.pres)togglePres();
});

$("b-exp").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(C,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);var outName=META.fileName||"agentforce-coworker-configurazione.json";a.download=outName;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},500);
  META={fileName:outName,how:"export",at:Date.now(),dirtyAt:0};saveMeta();updateInfo();
  say("Configurazione esportata come "+outName);
});
$("b-imp").addEventListener("click",function(){$("file").click()});
$("imgfile").addEventListener("change",function(e){
  var f=e.target.files[0],p=cur();
  if(f&&p){
    p.images=(p.images?p.images.replace(/\s+$/,"")+"\n":"")+f.name+" | ";
    save();touch();renderCfg();
    say("Aggiunto "+f.name+". Il file deve trovarsi nella stessa cartella del file HTML.");
  }
  e.target.value="";
});
$("file").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var c=normalize(JSON.parse(r.result));
      if(!c)throw new Error("formato");
      C=c;R.ci=0;R.pi=0;R.open=C.cats.length?0:null;newChat();
      META={fileName:f.name,how:"import",at:Date.now(),dirtyAt:0};saveMeta();
      save();renderCfg();say("Configurazione importata da "+f.name);
    }catch(err){say("Il file non è una configurazione valida. Esporta un file da questa pagina e riprova.")}
  };
  r.readAsText(f);e.target.value="";
});
var rstTimer=null;
$("b-rst").addEventListener("click",function(){
  if(!rstTimer){
    $("b-rst-t").textContent="Conferma ripristino";say("Il ripristino cancella le tue modifiche. Seleziona di nuovo per confermare.");
    rstTimer=setTimeout(function(){rstTimer=null;$("b-rst-t").textContent="Ripristina esempio";say("")},4000);return;
  }
  clearTimeout(rstTimer);rstTimer=null;$("b-rst-t").textContent="Ripristina esempio";
  C=normalize(clone(DEF));R.ci=0;R.pi=0;R.open=0;newChat();META={fileName:"",how:"",at:0,dirtyAt:0};saveMeta();save();renderCfg();say("Configurazione di esempio ripristinata");
});

renderPhone();renderCfg();
})();
